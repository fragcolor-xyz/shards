name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # run on specific file changes
    paths:
      - "**/*.rs"
      - "**/*.cpp"
      - "**/*.h"
      - "**/*.hpp"

jobs:
  claude-review:
    if: |
      github.event.pull_request.user.login == 'sinkingsugar' &&
      contains(github.event.pull_request.labels.*.name, 'claude-review')

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request. Use the repository's CLAUDE.md for guidance on style and conventions.

            ## Review Focus
            - Actual bugs that can occur in realistic usage scenarios
            - Security concerns with real attack vectors
            - Performance issues with measurable impact
            - Code quality and adherence to project patterns

            ## Before Flagging Issues
            - Verify the bug can actually occur (check the math, trace the logic)
            - Consider if the edge case is realistic (don't flag 1Hz sample rates, negative buffer sizes, etc.)
            - Distinguish between "will cause problems" vs "theoretically possible"

            ## Do NOT Flag
            - Theoretical edge cases requiring impossible/nonsensical inputs
            - Floating-point precision issues where the math is inherently bounded
            - "Nice to have" improvements as critical issues
            - Missing documentation for internal implementation details
            - Backward compatibility concerns (this is pre-release software)

            ## Issue Severity
            Rate each issue with confidence:
            - CRITICAL: Verified bug that will cause problems in normal usage
            - HIGH: Likely bug, logic appears flawed
            - MEDIUM: Potential issue worth investigating
            - LOW: Theoretical concern or style suggestion

            Be concise and actionable. Use `gh pr comment` to leave your review.

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://docs.claude.com/en/docs/claude-code/cli-reference for available options
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'

