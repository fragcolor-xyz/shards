name: Build (Linux Valgrind)

on:
  workflow_dispatch:
  workflow_call:

jobs:
  #
  # Build shards and run valgrind on Linux
  #
  Linux-valgrind:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout shards
        uses: actions/checkout@v3
        with:
          repository: fragcolor-xyz/shards
          fetch-depth: 1
          submodules: recursive
      - name: Set up dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install build-essential git cmake wget clang ninja-build xorg-dev libdbus-1-dev libssl-dev lcov mesa-utils libgtk-3-dev valgrind
          RUSTUP_TOOLCHAIN=`cat rust.version`
          echo "RUSTUP_TOOLCHAIN=$RUSTUP_TOOLCHAIN" >> $GITHUB_ENV
          rustup toolchain install $RUSTUP_TOOLCHAIN
          rustup component add rust-src --toolchain $RUSTUP_TOOLCHAIN
      - name: Build and Test
        env:
          # Use suppression file to ignore false positives from Rust optimizations (e.g. clap iterator code)
          VALGRIND_OPTS: "--exit-on-first-error=yes --error-exitcode=1 --fair-sched=yes --suppressions=../valgrind.supp"
        run: |
          mkdir build
          cd build
          cmake -G Ninja -DUSE_VALGRIND=1 -DCMAKE_BUILD_TYPE=RelWithDebInfo ..
          ninja shards
          ninja test-runtime
          valgrind $VALGRIND_OPTS ./shards new ../shards/tests/hello.shs
          valgrind $VALGRIND_OPTS ./shards new ../shards/tests/general.shs
          valgrind $VALGRIND_OPTS ./shards new ../shards/tests/strings.shs
          valgrind $VALGRIND_OPTS ./shards new ../shards/tests/table-compose.shs
          valgrind $VALGRIND_OPTS ./shards new ../shards/tests/variables.shs
          valgrind $VALGRIND_OPTS ./shards new ../shards/tests/flows.shs
          valgrind $VALGRIND_OPTS ./shards new ../shards/tests/linalg.shs
          valgrind $VALGRIND_OPTS ./shards new ../shards/tests/math.shs
          valgrind $VALGRIND_OPTS ./shards new ../shards/tests/math_audio.shs
          valgrind $VALGRIND_OPTS ./shards new ../shards/tests/return.shs
          valgrind $VALGRIND_OPTS ./shards new ../shards/tests/channels.shs
          valgrind $VALGRIND_OPTS ./shards new ../shards/tests/subwires.shs
          valgrind $VALGRIND_OPTS ./shards new ../shards/tests/const-vars.shs
          valgrind $VALGRIND_OPTS ./shards ../shards/tests/wires-embed-issue.shs
          LOG_network=trace valgrind $VALGRIND_OPTS ./shards new ../shards/tests/network.shs no-big-load:true
          LOG_network=trace valgrind $VALGRIND_OPTS ./shards new ../shards/tests/network-ws.shs no-big-load:true
          valgrind $VALGRIND_OPTS ./shards new ../shards/tests/capture-logs.shs
          valgrind $VALGRIND_OPTS ./shards new ../shards/tests/fs-security.shs
          valgrind $VALGRIND_OPTS ./shards new ../shards/tests/fileops.shs
          valgrind $VALGRIND_OPTS --exit-on-first-error=no --leak-check=full ./test-runtime
          valgrind $VALGRIND_OPTS ./shards new ../shards/tests/complex-deserialize.shs
          valgrind $VALGRIND_OPTS ./shards new ../shards/tests/table-seq-push.shs
          valgrind $VALGRIND_OPTS ./shards new ../shards/tests/traits.shs
          valgrind $VALGRIND_OPTS ./shards new ../shards/tests/help.shs
          valgrind $VALGRIND_OPTS ./shards new ../shards/tests/fib.shs
          valgrind $VALGRIND_OPTS ./shards new ../shards/tests/global-init.shs
          valgrind $VALGRIND_OPTS ./shards new ../shards/tests/jinja.shs
          valgrind $VALGRIND_OPTS ./shards new ../shards/tests/crdts.shs
          valgrind $VALGRIND_OPTS ./shards new ../shards/tests/crdt-benchmarks.shs
          valgrind $VALGRIND_OPTS ./shards new ../shards/tests/geo.shs
