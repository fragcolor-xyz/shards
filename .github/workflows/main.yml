name: CI

on:
  push:
    branches:
      - devel
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      rust-cache:
        description: Use existing rust cache?
        required: false
        default: false
        type: boolean

concurrency:
  # A new push to a PR cancels that PR's in-progress run; pushes to devel run to completion.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  Setup:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - run: exit 0

  #
  # Build shards for macOS
  #
  macOS-Debug:
    needs: Setup
    uses: ./.github/workflows/build-macos.yml
    secrets: inherit
    with:
      build-type: Debug
      run-tests: true
      run-subproject-tests: true
  
  macOS-Release:
    needs: Setup
    uses: ./.github/workflows/build-macos.yml
    secrets: inherit
    with:
      build-type: Release
      run-tests: true
      run-subproject-tests: true

  #
  # Build shards for emscripten
  #
  wasm32-emscripten:
    needs: [Setup]
    uses: ./.github/workflows/build-wasm.yml
    secrets: inherit

  # wasm32-emscripten-test:
  #   needs: [Setup, Linux-Release, wasm32-emscripten]
  #   uses: ./.github/workflows/test-wasm.yml
  #   secrets: inherit
  #   NOTE: Disabled — Chrome WebGPU requires a GPU-capable display server,
  #   which isn't available on the headless self-hosted Linux runner.

  #
  # Build shards for linux
  #
  Linux-Debug:
    needs: Setup
    uses: ./.github/workflows/build-linux.yml
    secrets: inherit
    with:
      build-type: Debug
  Linux-Release:
    needs: Setup
    uses: ./.github/workflows/build-linux.yml
    secrets: inherit
    with:
      build-type: Release
  Linux-Release-Library:
    needs: Setup
    uses: ./.github/workflows/build-linux-library.yml
    secrets: inherit
  Linux-GPU:
    needs: Setup
    uses: ./.github/workflows/test-macos-gpu.yml
    secrets: inherit
    with:
      build-type: Debug
  Codecov:
    needs: [Linux-Debug, Linux-GPU]
    uses: ./.github/workflows/codecov.yml
    secrets: inherit

  #
  # Build shards and run valgrind on Linux
  #
  Linux-valgrind:
    needs: Setup
    uses: ./.github/workflows/build-linux-valgrind.yml
    secrets: inherit

  #
  # Build shards for Windows
  #
  Windows-Debug:
    needs: Setup
    uses: ./.github/workflows/build-windows.yml
    secrets: inherit
    with:
      build-type: Debug
      run-tests: true
      vulkan: true
  Windows-Release:
    needs: Setup
    uses: ./.github/workflows/build-windows.yml
    secrets: inherit
    with:
      build-type: Release
      run-tests: true
      vulkan: false
  Windows-Release-Vulkan:
    needs: Setup
    uses: ./.github/workflows/build-windows.yml
    secrets: inherit
    with:
      build-type: Release
      run-tests: true
      vulkan: true
  Windows-Release-Library:
    needs: Setup
    uses: ./.github/workflows/build-windows.yml
    secrets: inherit
    with:
      build-type: Release
      binary-type: Library
      run-tests: false
      vulkan: false

  #
  # Build the documentation
  #
  docs:
    needs: [Windows-Debug, Windows-Release, Windows-Release-Vulkan]
    uses: ./.github/workflows/build-doc.yml
    secrets: inherit
    with:
      publish: ${{ github.ref == 'refs/heads/devel' && github.event_name == 'push' }}

  #
  # Build shards for iOS
  #
  iOS:
    needs: Setup
    uses: ./.github/workflows/build-ios.yml
    secrets: inherit
