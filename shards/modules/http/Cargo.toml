[package]
name = "shards-http"
description = ""
license = "BSD-3-Clause"
version = "0.1.0"
authors = ["Giovanni Petrantoni <sinkingsugar@gmail.com>"]
edition = "2021"

[lib]
crate-type = ["rlib", "staticlib"]

[features]
# No default - must explicitly choose native-tls or rustls
native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls"]
socks = ["reqwest/socks"]

[dependencies]
lazy_static = "1.5.0"
shards = { path = "../../rust" }
compile-time-crc32 = "0.1.2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "multipart", "stream", "cookies", "query", "form"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"