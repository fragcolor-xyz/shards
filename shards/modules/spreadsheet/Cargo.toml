[package]
name = "shards-spreadsheet"
description = "Read XLS/XLSX/XLSB/ODS files into Shards Tables/Seqs (LLM-friendly)."
license = "BSD-3-Clause"
version = "0.1.0"
authors = ["Giovanni Petrantoni <sinkingsugar@gmail.com>"]
edition = "2021"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
lazy_static = "1.5.0"
shards = { path = "../../rust" }
calamine = { version = "0.35", features = ["dates"] }
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
