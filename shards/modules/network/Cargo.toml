[package]
name = "shards-network"
description = ""
license = "BSD-3-Clause"
version = "0.1.0"
authors = ["Giovanni Petrantoni <sinkingsugar@gmail.com>"]
edition = "2021"

[lib]
crate-type = ["rlib", "staticlib"]

[features]
# No default - must explicitly choose native-tls or rustls
native-tls = ["tokio-tungstenite/native-tls", "tungstenite/native-tls"]
rustls = ["tokio-tungstenite/rustls-tls-native-roots", "tungstenite/rustls-native-certs"]

[dependencies]
lazy_static = "1.5.0"
shards = { path = "../../rust" }
compile-time-crc32 = "0.1.2"
# Need connect feature for connect_async, handshake for accept_async
tokio-tungstenite = {version = "0.28", default-features = false, features = ["connect", "handshake"]}
tungstenite = {version = "0.28", default-features = false, features = ["handshake"]}
slotmap = "1.0"
futures = "*"
url = "*"
futures-util = "*"
hyper = {version = "^1.1.0", features = ["server"]}
hyper-util = {version = "0.1.2", features = ["full"]}
http-body-util = "0.1"
http = "*"
reqwest = { version = "0.13", default-features = false }
log = "*"
anyhow = "^1.0.70"

[dependencies.tokio]
version = "*"
features = ["sync", "macros", "net", "fs"]
