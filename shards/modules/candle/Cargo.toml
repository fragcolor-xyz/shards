[package]
name = "shards-ml"
description = ""
license = "BSD-3-Clause"
version = "0.1.0"
authors = ["Giovanni Petrantoni <sinkingsugar@gmail.com>"]
edition = "2021"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
lazy_static = "1.5.0"
shards = { path = "../../rust" }
compile-time-crc32 = "0.1.2"
tokenizers = { version = "0.21.0", default-features = false, features = [
  "onig",
] }

mistralrs = { version = "0.8.1", default-features = false, optional = true }
candle-core = "0.10.2"
candle-nn = "0.10.2"
candle-transformers = "0.10.2"

rand = { version = "0.8", default-features = false, features = ["std_rng"] }
anyhow = "1.0.80"
ndarray = "0.15"
rand_distr = "0.4"

image = { version = "0.25", optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
either = { version = "1", optional = true }
serde_json = "1.0.136"
once_cell = "1.20.2"

[features]
default = []
llm = ["dep:mistralrs", "dep:image", "dep:tokio", "dep:either"]
metal = ["mistralrs?/metal", "candle-core/metal", "candle-transformers/metal", "candle-nn/metal"]
cuda = ["mistralrs?/cuda", "candle-core/cuda", "candle-transformers/cuda", "candle-nn/cuda"]
accelerate = ["mistralrs?/accelerate", "candle-core/accelerate", "candle-transformers/accelerate", "candle-nn/accelerate"]
