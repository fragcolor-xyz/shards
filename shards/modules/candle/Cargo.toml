[package]
name = "shards-ml"
description = ""
license = "BSD-3-Clause"
version = "0.1.0"
authors = ["Giovanni Petrantoni <sinkingsugar@gmail.com>"]
edition = "2021"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
lazy_static = "1.5.0"
shards = { path = "../../rust" }
compile-time-crc32 = "0.1.2"
tokenizers = { version = "0.21.0", default-features = false, features = [
  "onig",
] }

candle-core = { git = "https://github.com/shards-lang/candle.git", rev = "0467cf76773722264d63c22d264b8495ed2b848c" }
candle-transformers = { git = "https://github.com/shards-lang/candle.git", rev = "0467cf76773722264d63c22d264b8495ed2b848c" }
candle-nn = { git = "https://github.com/shards-lang/candle.git", rev = "0467cf76773722264d63c22d264b8495ed2b848c" }
# candle-core = { path = "../../../../candle/candle-core" }
# candle-transformers = { path = "../../../../candle/candle-transformers" }
# candle-nn = { path = "../../../../candle/candle-nn" }

rand = { version = "0.8", default-features = false, features = ["std_rng"] }
anyhow = "1.0.80"
ndarray = "0.15"
rand_distr = "0.4"

serde_json = "1.0.136"
once_cell = "1.20.2"

[features]
default = []
metal = ["candle-core/metal", "candle-transformers/metal", "candle-nn/metal"]
cuda = ["candle-core/cuda", "candle-transformers/cuda", "candle-nn/cuda"]
accelerate = ["candle-core/accelerate", "candle-transformers/accelerate", "candle-nn/accelerate"]
