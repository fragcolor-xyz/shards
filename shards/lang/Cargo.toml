[package]
name = "shards-lang"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
pest = "2.8"
pest_derive = "2.8"
flexbuffers = "2.0.0" 
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
shards = { path = "../rust" }
hex = { version = "0.4.3" }
nanoid = "0.4.0"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
profiling = { version = "1", default-features = false }
compile-time-crc32 = "0.1.2"
lazy_static = "1.5.0"
dunce = "1.0"
once_cell = "1.21"
dashmap = "6.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Used by `shards pak` to embed/read the payload as a PE resource.
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
] }


[features]
default = ["exported"]
tracy = ["profiling/profile-with-tracy"]
exported = []

[build-dependencies]
cbindgen = "0.24.0"
