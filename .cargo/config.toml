[profile.rel-with-deb-info]
inherits = "release"
debug-assertions = true
debug = "line-tables-only"

[profile.rel-with-deb-info-tracy]
inherits = "rel-with-deb-info" 

[profile.release-tracy]
inherits = "release" 

[profile.debug-tracy]
inherits = "dev"  

[profile.small]
inherits = "release"
opt-level = "z"
codegen-units = 1
panic = "abort"
# This saves like 2MB (from 52 to 50MB on formabble)
lto = true